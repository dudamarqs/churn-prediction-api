[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-api"
version = "0.1.0"
description = "Pipeline preditivo de churn com Scikit-Learn e FastAPI"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scikit-learn==1.9.1",
    "openpyxl>=3.1",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
